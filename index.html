<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="BLOCK — лаунчер, мессенджер и игровое сообщество.">
<title>BLOCK — Messenger</title>
<style>
:root{color-scheme:dark;--bg:#090e1a;--panel:#101827;--panel2:#151f31;--line:#243149;--text:#edf3ff;--muted:#8796b1;--blue:#5794ff;--blue2:#3478ef;--green:#55d6a0;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#172b50 0,transparent 38%),radial-gradient(ellipse at 100% 100%,#152443 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{height:100vh;min-height:620px;max-width:1600px;margin:auto;padding:18px;display:grid;grid-template-columns:76px 320px minmax(0,1fr);gap:14px}
.rail,.chats,.conversation{background:#0e1727e8;border:1px solid #26344c;border-radius:22px;box-shadow:0 20px 70px #0003;backdrop-filter:blur(18px)}
.rail{display:flex;align-items:center;flex-direction:column;padding:15px 10px;gap:14px}.brand{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#70adff,#2869df);font-size:23px;font-weight:900;box-shadow:0 8px 25px #3478ef55;margin-bottom:16px}
.rail-btn{width:46px;height:46px;border-radius:14px;background:transparent;color:#8fa0bd;font-size:19px;transition:.2s}.rail-btn:hover,.rail-btn.active{background:#294a7d;color:white}.rail-spacer{flex:1}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#ffbd75,#d96b89);font-weight:800;color:#182033}
.chats{display:flex;flex-direction:column;min-width:0;overflow:hidden}.side-head{padding:22px 20px 15px;display:flex;justify-content:space-between;align-items:center}.wordmark{font-weight:900;font-size:21px;letter-spacing:1.8px}.wordmark span{color:#78aaff}.sub{color:var(--muted);font-size:12px;margin-top:3px}.new-chat{width:38px;height:38px;border-radius:13px;background:#233e69;color:#a9ccff;font-size:23px}.search{padding:0 16px 15px}.search input{width:100%;border:1px solid var(--line);background:#0a1220;border-radius:12px;padding:12px 14px;color:var(--text)}.tabs{display:flex;gap:7px;padding:0 16px 13px}.tab{padding:7px 12px;border-radius:20px;background:transparent;color:var(--muted);font-size:12px}.tab.active{background:#203b65;color:#c8ddff}.chat-list{overflow:auto;padding:0 8px 12px}.chat-item{width:100%;display:flex;gap:12px;text-align:left;padding:12px;border-radius:14px;background:transparent;align-items:center}.chat-item:hover,.chat-item.active{background:#1a2a43}.chat-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:17px;background:linear-gradient(145deg,#668fe5,#3b5eaa)}.chat-avatar.pink{background:linear-gradient(145deg,#e28bb0,#9b5b91)}.chat-avatar.green{background:linear-gradient(145deg,#66cda4,#398c82)}.chat-avatar.orange{background:linear-gradient(145deg,#e9b16e,#b66b4d)}.chat-meta{min-width:0;flex:1}.chat-top{display:flex;justify-content:space-between;gap:8px}.chat-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:var(--muted);white-space:nowrap}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{background:var(--blue2);border-radius:20px;padding:1px 7px;font-size:10px}
.conversation{display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}.welcome{height:100%;display:grid;place-items:center;text-align:center;padding:25px}.welcome-mark{width:76px;height:76px;margin:0 auto 20px;border-radius:25px;background:linear-gradient(145deg,#5b9cff,#285fc7);display:grid;place-items:center;font-size:34px;box-shadow:0 14px 40px #3478ef55}.welcome h1{font-size:28px;margin:0 0 8px}.welcome p{color:var(--muted);max-width:390px;margin:0 auto}.welcome .hint{margin-top:24px;font-size:12px;color:#7083a3}
.chat-view{display:none;flex-direction:column;height:100%;min-height:0}.chat-view.visible{display:flex}.chat-header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 23px;gap:13px;flex:none}.head-name{font-weight:750}.online{font-size:11px;color:var(--green)}.header-actions{margin-left:auto;display:flex;gap:8px}.icon-btn{width:38px;height:38px;border-radius:12px;background:#17243a;color:#a9bddc}.messages{flex:1;overflow:auto;padding:24px clamp(15px,5vw,70px);display:flex;flex-direction:column;gap:12px}.day-label{align-self:center;color:#8192ad;background:#142036;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11px;margin:3px 0 8px}.msg{max-width:min(72%,560px);padding:11px 14px;border-radius:16px;background:#1a2940;border:1px solid #2a3a54;align-self:flex-start;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#2b65bd,#28549a);border-color:#477ac1;border-bottom-right-radius:5px}.msg:not(.mine){border-bottom-left-radius:5px}.msg-time{font-size:10px;color:#b8c8e0;text-align:right;margin-top:5px}.composer-wrap{padding:14px 20px 18px;border-top:1px solid var(--line);flex:none}.composer{display:flex;align-items:flex-end;gap:10px;background:#0a1322;border:1px solid #2a3b56;border-radius:17px;padding:8px}.composer textarea{resize:none;max-height:130px;min-height:42px;flex:1;background:transparent;border:0;color:var(--text);padding:10px 5px;outline:none}.attach{width:40px;height:40px;border-radius:12px;background:transparent;color:#8ea4c7;font-size:20px}.send{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#65a5ff,#3478ed);font-size:18px;box-shadow:0 6px 20px #3478ef44}.compose-note{text-align:center;font-size:10px;color:#687b99;margin-top:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#1b2b43;border:1px solid #385274;padding:11px 16px;border-radius:12px;transition:.25s;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;background:#030712b8;display:none;place-items:center;padding:20px;z-index:10}.modal-backdrop.open{display:grid}.modal{width:min(420px,100%);background:#111c2e;border:1px solid #344663;border-radius:20px;padding:23px;box-shadow:0 30px 100px #0009}.modal h2{margin:0 0 7px}.modal p{color:var(--muted);font-size:13px}.modal input{width:100%;background:#091322;border:1px solid var(--line);border-radius:11px;padding:12px;color:white;margin:12px 0}.modal-actions{display:flex;justify-content:flex-end;gap:9px}.secondary,.primary{padding:10px 15px;border-radius:11px}.secondary{background:#24334b}.primary{background:#3478ed}
@media(max-width:900px){.app{grid-template-columns:64px 280px minmax(0,1fr);padding:10px;gap:9px}.rail{padding:12px 7px}.msg{max-width:85%}}
@media(max-width:650px){.app{height:100dvh;min-height:500px;grid-template-columns:58px minmax(0,1fr);padding:7px;gap:7px}.rail{border-radius:17px}.chats{border-radius:17px}.conversation{display:none;position:fixed;inset:7px;z-index:3;border-radius:17px}.conversation.mobile-open{display:flex}.side-head{padding:16px 14px 12px}.search{padding:0 12px 12px}.tabs{padding:0 12px 10px}.chat-header{height:68px;padding:0 13px}.messages{padding:17px 13px}.composer-wrap{padding:10px}.back-mobile{display:block!important}.wordmark{font-size:18px}.sub{font-size:10px}}
.back-mobile{display:none}
</style>
</head>
<body>
<div class="app">
 <aside class="rail" aria-label="Навигация">
  <div class="brand" title="BLOCK">B</div>
  <button class="rail-btn active" title="Мессенджер" aria-label="Мессенджер">✉</button>
  <button class="rail-btn" title="Друзья" aria-label="Друзья" id="friendsBtn">♙</button>
  <button class="rail-btn" title="Сообщество" aria-label="Сообщество" id="communityBtn">◈</button>
  <div class="rail-spacer"></div>
  <button class="rail-btn" title="Профиль" aria-label="Профиль" id="profileBtn">⚙</button>
  <div class="avatar" id="myAvatar">P</div>
 </aside>
 <aside class="chats">
  <div class="side-head"><div><div class="wordmark">BLO<span>CK</span></div><div class="sub">твой игровой круг</div></div><button class="new-chat" id="newChat" title="Новый чат">＋</button></div>
  <div class="search"><input id="search" placeholder="⌕  Поиск чатов" autocomplete="off"></div>
  <div class="tabs"><button class="tab active" data-filter="all">Все</button><button class="tab" data-filter="unread">Непрочитанные</button></div>
  <div class="chat-list" id="chatList"></div>
 </aside>
 <main class="conversation" id="conversation">
  <div class="welcome" id="welcome"><div><div class="welcome-mark">B</div><h1>Добро пожаловать в BLOCK</h1><p>Место, где команда, друзья и игровые разговоры собираются в одном пространстве.</p><div class="hint">Выбери чат слева или создай новый</div></div></div>
  <section class="chat-view" id="chatView">
   <header class="chat-header"><button class="icon-btn back-mobile" id="backBtn" aria-label="Назад">←</button><div class="chat-avatar" id="activeAvatar">B</div><div><div class="head-name" id="activeName">BLOCK</div><div class="online" id="activeStatus">чат</div></div><div class="header-actions"><button class="icon-btn" id="chatInfo" title="Информация">ⓘ</button></div></header>
   <div class="messages" id="messages"><div class="day-label">Сегодня</div></div>
   <div class="composer-wrap"><div class="composer"><button class="attach" id="emojiBtn" title="Эмодзи">☺</button><textarea id="messageInput" rows="1" placeholder="Написать сообщение…"></textarea><button class="send" id="sendBtn" title="Отправить">➤</button></div><div class="compose-note">Enter — отправить · Shift + Enter — новая строка</div></div>
  </section>
 </main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">Новый чат</h2><p id="modalDescription">Создай локальный чат в этом браузере.</p><input id="modalInput" maxlength="32" placeholder="Название чата"><div class="modal-actions"><button class="secondary" id="cancelModal">Отмена</button><button class="primary" id="confirmModal">Создать</button></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const STORE='block_messenger_v1';
const seed=[
 {id:'general',name:'BLOCK • Общий чат',initial:'B',color:'',status:'Сообщество BLOCK',messages:[{id:1,text:'Добро пожаловать в BLOCK! Здесь будут новости, обсуждения и игровые разговоры. 🚀',mine:false,time:'12:30'}]},
 {id:'minecraft',name:'Minecraft',initial:'M',color:'green',status:'Игровой чат',messages:[{id:1,text:'Какая версия Minecraft сейчас самая любимая?',mine:false,time:'12:34'}]},
 {id:'team',name:'Команда BLOCK',initial:'B',color:'pink',status:'Групповой чат',messages:[{id:1,text:'Обсуждаем идеи и обновления проекта здесь.',mine:false,time:'12:40'}]},
 {id:'ideas',name:'Идеи и предложения',initial:'✦',color:'orange',status:'Предложения сообщества',messages:[]}
];
let state;try{state=JSON.parse(localStorage.getItem(STORE))||null}catch{}
if(!state||!Array.isArray(state.chats))state={name:'Potato555',chats:seed,active:null};
if(!state.name)state.name='Игрок';
let activeFilter='all';
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{ $('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)};
const activeChat=()=>state.chats.find(c=>c.id===state.active);
function renderList(){const q=$('search').value.trim().toLowerCase();$('chatList').innerHTML='';state.chats.filter(c=>(activeFilter==='all'||c.unread)&&(!q||c.name.toLowerCase().includes(q))).forEach(c=>{const last=c.messages[c.messages.length-1];const b=document.createElement('button');b.className='chat-item'+(c.id===state.active?' active':'');b.innerHTML='<div class="chat-avatar '+esc(c.color||'')+'">'+esc(c.initial)+'</div><div class="chat-meta"><div class="chat-top"><span class="chat-name">'+esc(c.name)+'</span><span class="time">'+(last?esc(last.time):'')+'</span></div><div class="preview">'+(last?(last.mine?'Вы: ':'')+esc(last.text):'Пока нет сообщений')+'</div></div>'+(c.unread?'<span class="unread">1</span>':'');b.addEventListener('click',()=>openChat(c.id));$('chatList').appendChild(b)})}
function openChat(id){state.active=id;const c=activeChat();if(!c)return;c.unread=false;$('welcome').style.display='none';$('chatView').classList.add('visible');$('activeName').textContent=c.name;$('activeStatus').textContent=c.status||'чат';$('activeAvatar').textContent=c.initial;$('activeAvatar').className='chat-avatar '+(c.color||'');renderMessages();renderList();$('conversation').classList.add('mobile-open');save()}
function renderMessages(){const c=activeChat();if(!c)return;const box=$('messages');box.innerHTML='<div class="day-label">Сегодня</div>';c.messages.forEach(m=>{const el=document.createElement('div');el.className='msg'+(m.mine?' mine':'');el.innerHTML=esc(m.text).replace(/\n/g,'<br>')+'<div class="msg-time">'+esc(m.time)+'</div>';box.appendChild(el)});box.scrollTop=box.scrollHeight}
function send(){const c=activeChat(),input=$('messageInput'),text=input.value.trim();if(!c||!text)return;c.messages.push({id:Date.now(),text,mine:true,time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});input.value='';input.style.height='auto';save();renderMessages();renderList()}
function modal(title,desc,placeholder,callback){$('modalTitle').textContent=title;$('modalDescription').textContent=desc;$('modalInput').placeholder=placeholder;$('modalInput').value='';$('modalBackdrop').classList.add('open');$('modalInput').focus();$('confirmModal').onclick=()=>{const v=$('modalInput').value.trim();if(!v){$('modalInput').focus();return}$('modalBackdrop').classList.remove('open');callback(v)}}
$('newChat').onclick=()=>modal('Новый чат','Создай чат, который появится в твоём списке.','Название чата',name=>{const id='chat_'+Date.now();state.chats.unshift({id,name,initial:name.slice(0,1).toUpperCase(),color:'green',status:'Личный чат',messages:[]});save();renderList();openChat(id);toast('Чат создан')});
$('cancelModal').onclick=()=>$('modalBackdrop').classList.remove('open');
$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))$('modalBackdrop').classList.remove('open')};
$('sendBtn').onclick=send;
$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('messageInput').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,130)+'px'});
$('search').addEventListener('input',renderList);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderList()});
$('backBtn').onclick=()=>$('conversation').classList.remove('mobile-open');
$('emojiBtn').onclick=()=>{const i=$('messageInput');i.value+=' 😊';i.focus()};
$('chatInfo').onclick=()=>{const c=activeChat();if(c)toast(c.name+' · '+(c.status||'BLOCK'))};
$('profileBtn').onclick=()=>modal('Твой профиль','Имя отображается локально в этом браузере.','Имя пользователя',name=>{state.name=name;$('myAvatar').textContent=name.slice(0,1).toUpperCase();save();toast('Имя профиля обновлено')});
$('friendsBtn').onclick=()=>toast('Раздел друзей появится в следующем обновлении');
$('communityBtn').onclick=()=>{openChat('general');toast('Открыто сообщество BLOCK')};
$('myAvatar').textContent=state.name.slice(0,1).toUpperCase();
renderList();
if(state.active&&state.chats.some(c=>c.id===state.active))openChat(state.active);
})();
</script>
</body>
</html>
