<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <title>BlockLauncher — скоро запуск</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 15%, #244c83 0, #111b30 38%, #080d19 75%);
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 620px; }
    .mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
      border: 1px solid #ffffff30;
      border-radius: 22px;
      background: #ffffff12;
      box-shadow: 0 12px 50px #0005;
      font-size: 38px;
    }
    h1 { margin: 0 0 14px; font-size: clamp(38px, 8vw, 64px); letter-spacing: -2px; }
    p { margin: 0; color: #c1d0e8; font-size: clamp(17px, 3vw, 20px); line-height: 1.6; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 30px;
      padding: 11px 17px;
      border: 1px solid #78aaff45;
      border-radius: 999px;
      background: #4389ff18;
      color: #dce9ff;
      font-size: 14px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #65a2ff; box-shadow: 0 0 12px #65a2ff; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⛏️</div>
    <h1>BlockLauncher</h1>
    <p>Сайт находится в разработке.<br>Мы готовим кое-что интересное. Скоро увидимся!</p>
    <div class="status"><span class="dot"></span> В разработке</div>
  </main>
</body>
</html>
