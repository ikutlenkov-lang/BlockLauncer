
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockLauncher</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #244c83, #080d19 65%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { padding: 30px; }
    h1 { font-size: clamp(42px, 9vw, 76px); margin-bottom: 12px; }
    p { color: #b8c9e5; font-size: 18px; }
    a {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 28px;
      border-radius: 14px;
      background: #4389ff;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>BlockLauncher</h1>
    <p>Твой мир Minecraft начинается здесь.</p>
    <a href="#">Explore BlockLauncher</a>
  </main>
</body>
</html>
