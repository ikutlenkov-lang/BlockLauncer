name: Build BLOCK Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Add microphone and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          missing = [p for p in permissions if p.split('android:name="')[1].split('"')[0] not in text]
          if missing:
              marker = "    <application"
              if marker not in text:
                  raise SystemExit("Could not find <application> in AndroidManifest.xml")
              text = text.replace(marker, "\n".join(missing) + "\n" + marker, 1)
              manifest.write_text(text, encoding="utf-8")

          main_activity = next(Path("android/app/src/main").rglob("MainActivity.java"), None)
          if main_activity is None:
              raise SystemExit("Could not find generated MainActivity.java")
          source = main_activity.read_text(encoding="utf-8")
          if "POST_NOTIFICATIONS" not in source:
              method = """
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (android.os.Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS")
                          != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{"android.permission.POST_NOTIFICATIONS"},
                          1002
                      );
                  }
              }
          """
              position = source.rfind("}")
              if position < 0:
                  raise SystemExit("Could not find end of MainActivity.java")
              source = source[:position] + method + "\n" + source[position:]
              main_activity.write_text(source, encoding="utf-8")

          print("Microphone and Android notification permission configured.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOCK-Messenger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
